<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="toothGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F0F9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F2FE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with brand color -->
  <circle cx="50" cy="50" r="50" fill="#0EA5E9"/>
  
  <!-- Tooth shape - simplified for better visibility at small sizes -->
  <g>
    <!-- Main tooth body -->
    <path d="M 50 22 
             C 40 22, 32 28, 32 38
             L 32 56
             C 32 62, 29 68, 27 73
             C 25 78, 26 83, 30 87
             C 34 91, 38 89, 40 83
             C 41 79, 42 73, 43 66
             L 43 38
             C 43 33, 46 28, 50 28
             C 54 28, 57 33, 57 38
             L 57 66
             C 58 73, 59 79, 60 83
             C 62 89, 66 91, 70 87
             C 74 83, 75 78, 73 73
             C 71 68, 68 62, 68 56
             L 68 38
             C 68 28, 60 22, 50 22 Z"
          fill="url(#toothGradient)" 
          stroke="#0284C7" 
          stroke-width="1.5"/>
    
    <!-- Bright shine highlights for that sparkle effect -->
    <ellipse cx="40" cy="32" rx="5" ry="8" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="37" cy="29" rx="2" ry="4" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Small sparkle star -->
    <path d="M 60 35 L 61 37 L 63 38 L 61 39 L 60 41 L 59 39 L 57 38 L 59 37 Z" 
          fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
